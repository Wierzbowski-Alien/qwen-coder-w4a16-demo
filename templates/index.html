<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek-R1 W4A16 • Demo</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }
  .container { width: 100%; max-width: 800px; }
  header {
    text-align: center;
    margin-bottom: 2rem;
  }
  header h1 { font-size: 1.6rem; color: #58a6ff; margin-bottom: 0.3rem; }
  header p  { font-size: 0.85rem; color: #8b949e; }
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 1.5rem;
    margin-bottom: 1rem;
  }
  textarea {
    width: 100%;
    min-height: 80px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #c9d1d9;
    padding: 0.75rem;
    font-family: monospace;
    font-size: 0.95rem;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
  }
  textarea:focus { border-color: #58a6ff; }
  .row {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    margin-top: 0.75rem;
    flex-wrap: wrap;
  }
  .row label { font-size: 0.85rem; color: #8b949e; white-space: nowrap; }
  input[type="range"] { flex: 1; min-width: 120px; accent-color: #58a6ff; }
  #tokLabel { color: #58a6ff; font-weight: 600; min-width: 2.5rem; }
  button {
    background: #238636;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 0.65rem 1.5rem;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
    white-space: nowrap;
  }
  button:hover { background: #2ea043; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .prompts {
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
    margin-top: 0.5rem;
  }
  .prompts button {
    background: #21262d;
    color: #8b949e;
    font-size: 0.78rem;
    padding: 0.3rem 0.7rem;
    font-weight: 400;
    border: 1px solid #30363d;
  }
  .prompts button:hover { background: #30363d; color: #c9d1d9; }
  #response {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 1rem;
    min-height: 60px;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 0.95rem;
    line-height: 1.6;
    display: none;
  }
  #response.visible { display: block; }
  #loader {
    display: none;
    text-align: center;
    padding: 2rem;
    color: #8b949e;
  }
  #loader.visible { display: block; }
  .spinner {
    width: 24px; height: 24px;
    border: 3px solid #30363d;
    border-top-color: #58a6ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 0.5rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .stats {
    display: flex;
    gap: 1.5rem;
    margin-top: 0.75rem;
    font-size: 0.82rem;
    color: #8b949e;
    flex-wrap: wrap;
  }
  .stats span { color: #58a6ff; font-weight: 600; }
  .error {
    color: #f85149;
    background: #1f0e0e;
    border: 1px solid #f8514933;
    border-radius: 6px;
    padding: 1rem;
    display: none;
  }
  .error.visible { display: block; }
  .badge {
    display: inline-block;
    background: #1f2a1f;
    color: #3fb950;
    border: 1px solid #3fb95033;
    border-radius: 20px;
    padding: 0.15rem 0.6rem;
    font-size: 0.75rem;
    font-weight: 600;
    margin-left: 0.5rem;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>DeepSeek-R1 <span style="color:#c9d1d9;">W4A16</span> <span class="badge">69 tok/s</span></h1>
    <p>RTX 3060 • 6.5 GB VRAM • 7B params INT4 • CUDA custom kernels</p>
  </header>

  <div class="card">
    <textarea id="prompt" placeholder="Pose une question, écris une histoire...">The capital of France is</textarea>
    <div class="prompts">
      <button onclick="setPrompt('The capital of France is')">Paris ?</button>
      <button onclick="setPrompt('Explain quantum computing in simple terms.')">Quantum</button>
      <button onclick="setPrompt('Write a haiku about programming.')">Haiku</button>
      <button onclick="setPrompt('def fibonacci(n):')">Fibonacci</button>
      <button onclick="setPrompt('Once upon a time,')">Histoire</button>
      <button onclick="setPrompt('What is the meaning of life?')">Philosophie</button>
    </div>
    <div class="row">
      <label for="tokens">Tokens max :</label>
      <input type="range" id="tokens" min="10" max="500" value="100" step="10" oninput="updateTokLabel()">
      <span id="tokLabel">100</span>
      <button id="btnGenerate" onclick="doGenerate()">Générer</button>
    </div>
  </div>

  <div id="loader"><div class="spinner"></div>Génération en cours...</div>
  <div id="error" class="error"></div>
  <div id="response"></div>
  <div class="stats" id="stats" style="display:none">
    <div>Temps : <span id="statTime">—</span></div>
    <div>Tokens : <span id="statTokens">—</span></div>
    <div>Débit : <span id="statSpeed">—</span></div>
  </div>
</div>

<script>
let loading = false;

function setPrompt(text) {
  document.getElementById('prompt').value = text;
}

function updateTokLabel() {
  document.getElementById('tokLabel').textContent = document.getElementById('tokens').value;
}

function $(id) { return document.getElementById(id); }

async function doGenerate() {
  if (loading) return;
  const prompt = $('prompt').value.trim();
  if (!prompt) return;

  loading = true;
  $('btnGenerate').disabled = true;
  $('loader').classList.add('visible');
  $('response').classList.remove('visible');
  $('error').classList.remove('visible');
  $('stats').style.display = 'none';

  try {
    const res = await fetch('/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        prompt: prompt,
        max_tokens: parseInt($('tokens').value)
      })
    });

    const data = await res.json();
    if (data.error) {
      $('error').textContent = data.error;
      $('error').classList.add('visible');
    } else {
      $('response').textContent = data.response;
      $('response').classList.add('visible');
      $('statTime').textContent = data.time_s + ' s';
      $('statTokens').textContent = data.tokens;
      $('statSpeed').textContent = data.tok_s + ' tok/s';
      $('stats').style.display = 'flex';
    }
  } catch (e) {
    $('error').textContent = 'Erreur de connexion : ' + e.message;
    $('error').classList.add('visible');
  }

  $('loader').classList.remove('visible');
  $('btnGenerate').disabled = false;
  loading = false;
}

// Allow Ctrl+Enter to generate
$('prompt').addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.key === 'Enter') doGenerate();
});
</script>
</body>
</html>
